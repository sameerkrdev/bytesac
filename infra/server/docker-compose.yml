# Bytesac on one Linux VM, run by rootless Docker as an ordinary user (no root daemon, no docker group):
#   nginx on the VM (HTTPS, installed and configured by hand) → web (Next.js, 127.0.0.1:3000) and API (127.0.0.1:4000)
#   + worker (BullMQ) + Redis. PostgreSQL is external (Supabase, ADR-005/006) unless you start the "selfhost-db" profile.
#
#   cd infra/server
#   cp .env.example .env && cp api.env.example api.env && cp migrate.env.example migrate.env   # then fill them in
#   docker compose build && docker compose build migrate
#   docker compose --profile tools run --rm migrate      # once per release, before starting the new API
#   docker compose up -d
#
# Releases: ./deploy.sh <commit> (also what GitHub Actions runs). Runbook: docs/engineering/DEPLOY-GCP.md
#
# Web and API publish only on 127.0.0.1: nothing but nginx on this VM can reach them, so the forwarded client IP nginx
# sets cannot be forged from outside.

name: bytesac-server

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_ORIGIN: http://api:4000
        NEXT_PUBLIC_APP_URL: https://${WEB_DOMAIN:?set WEB_DOMAIN in infra/server/.env}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
        NEXT_PUBLIC_IOS_APP_URL: ${NEXT_PUBLIC_IOS_APP_URL:-}
        NEXT_PUBLIC_ANDROID_APP_URL: ${NEXT_PUBLIC_ANDROID_APP_URL:-}
    image: bytesac-web:latest
    restart: unless-stopped
    environment:
      APP_HOST: ${WEB_DOMAIN:?set WEB_DOMAIN in infra/server/.env}
      MARKETING_HOST: ${MARKETING_DOMAIN:-}
      PREVIEW_GATE_JWT_SECRET: ${PREVIEW_GATE_JWT_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: bytesac-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file: ./api.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      REDIS_URL: redis://redis:6379
      # Requests reach the API from nginx (through rootless Docker's port forwarder, which arrives from an internal
      # address) or from the web container (compose network). Trust only those private hops; nginx overwrites
      # X-Forwarded-For with the real client address, so the API sees the true client IP.
      TRUST_PROXY: loopback,uniquelocal
    depends_on:
      redis:
        condition: service_healthy
    networks: [edge]

  worker:
    image: bytesac-api:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: ./api.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [edge]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ must never lose keys: no eviction, append-only persistence.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [edge]

  # One-off: docker compose --profile tools run --rm migrate (needs MIGRATOR_DATABASE_URL in migrate.env)
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    image: bytesac-migrate:latest
    env_file: ./migrate.env
    profiles: ["tools"]
    networks: [edge]

  # One-off: the audited ops CLI, for example
  #   docker compose --profile tools run --rm cli ops:grant-role -- --user <uuid> --role ops_admin --operator you@example.com
  cli:
    image: bytesac-migrate:latest
    pull_policy: never
    working_dir: /repo/apps/api
    entrypoint: ["pnpm"]
    env_file: ./api.env
    environment:
      REDIS_URL: redis://redis:6379
    profiles: ["tools"]
    networks: [edge]

  # Optional self-hosted PostgreSQL 17 with pg_cron and pgvector (the repository's dev image) instead of Supabase.
  # Start with --profile selfhost-db; back up the volume yourself (no managed backups).
  postgres:
    build: ../docker/postgres
    profiles: ["selfhost-db"]
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=bytesac_dev"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: postgres
    volumes:
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30
    networks: [edge]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis_data:
  pg_data:
