# Reference nginx site for the single-VM deployment. nginx runs on the VM itself (apt package), not in Docker.
# Copy it by hand, replace the two domains, then let certbot add HTTPS (docs/engineering/DEPLOY-GCP.md §17):
#
#   sudo cp infra/server/nginx/bytesac.conf /etc/nginx/sites-available/bytesac
#   sudo nano /etc/nginx/sites-available/bytesac          # app.example.com / api.example.com → your domains
#   sudo ln -s /etc/nginx/sites-available/bytesac /etc/nginx/sites-enabled/bytesac
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.example.com -d api.example.com --redirect
#
# Client IP: X-Forwarded-For is SET to $remote_addr, never appended ($proxy_add_x_forwarded_for would keep whatever the
# client sent, letting anyone pick their own IP for the API's per-IP rate limits). If you later put a CDN such as
# Cloudflare's proxy in front, use the real_ip module with its ranges and set GEO_COUNTRY_HEADER in api.env.

upstream bytesac_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream bytesac_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# Marketing / waitlist (apex). Same Next.js container as the app host.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://bytesac_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

# Web app (browsers; also serves /api/* through the Next.js rewrite)
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # JSON bodies only: documents upload straight to R2 with signed URLs
    client_max_body_size 2m;

    location / {
        proxy_pass http://bytesac_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

# Public API (the mobile app calls it directly)
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://bytesac_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
