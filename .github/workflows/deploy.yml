# Deploys main to the Google Cloud VM after CI passes on main, or on demand (any commit of main, for rollback).
# GitHub signs in to Google Cloud with Workload Identity Federation (no stored Google key), opens an IAP tunnel to the
# VM's SSH port (port 22 stays closed to the internet) and runs infra/server/deploy.sh as the ordinary user that owns
# rootless Docker, through a key that can only run that script. Skipped until the GCP_* repository variables are
# set. Setup: docs/engineering/DEPLOY-GCP.md §22.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit hash on main to deploy (empty = the commit this run starts from)
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      VM_NAME: ${{ vars.GCP_VM_NAME }}
      VM_ZONE: ${{ vars.GCP_VM_ZONE }}
      VM_USER: ${{ vars.GCP_VM_USER }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Open an IAP tunnel to the VM's SSH port
        run: |
          gcloud compute start-iap-tunnel "$VM_NAME" 22 --project "$PROJECT_ID" --zone "$VM_ZONE" \
            --local-host-port=localhost:2222 > "$RUNNER_TEMP/iap.log" 2>&1 &
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2222) 2> /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/iap.log"
          exit 1

      - name: Deploy ${{ env.SHA }}
        env:
          SSH_KEY: ${{ secrets.VM_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The VM's authorized_keys entry forces infra/server/deploy.sh; the argument is only the commit hash.
          ssh -i ~/.ssh/deploy_key -p 2222 \
            -o HostKeyAlias=bytesac-vm -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$VM_USER@localhost" "$SHA"

      - name: Check the public endpoint
        if: vars.PUBLIC_API_URL != ''
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.PUBLIC_API_URL }}/health"
