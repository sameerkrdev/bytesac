packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  '@reown/appkit': false
  '@tailwindcss/oxide': true
  bigint-buffer: false
  bufferutil: false
  esbuild: true
  keccak: false
  msgpackr-extract: false
  protobufjs: false
  unrs-resolver: true
  utf-8-validate: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
overrides:
  '@wagmi/connectors': 6.2.0
  '@wagmi/core': 2.22.1
  viem: 2.56.9
